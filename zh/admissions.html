<h1>招收研究生</h1>

<p>
  本研究組正在積極招收對理論凝聚態物理感興趣的博士及研究碩士（MPhil）學生，尤其歡迎對對稱性、拓撲、量子多體系統的數學結構等課題有興趣的同學。
</p>

<p>
  所有獲香港科技大學取錄的研究生均可獲得獎學金。詳細的申請程序、截止日期、獎學金及學費資料，請參閱
  <a href="https://fytgs.hkust.edu.hk/admissions/Admission-to-Hong-Kong-Campus/submitting-an-application/scholarships-and-fees">HKUST Postgraduate Admissions</a> 網頁。
</p>

<p>
  有興趣的同學，請在申請前透過電郵 <a href="mailto:hwatanabe@ust.hk">hwatanabe@ust.hk</a> 聯絡渡邊教授。
</p>
